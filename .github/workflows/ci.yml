name: CI

# Catches the production-break class this repo has hit repeatedly (a stale import,
# a dropped variable, an icon crossing the RSC boundary): tsc + next build run on
# every PR and push, exactly what would have caught PR #100 / #104 / #125 before
# they reached Vercel.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Políticas RLS, triggers y RPCs de la migración 043 contra un PostgreSQL 16
  # real (tests/rls-estandar-privado.test.ts). Separado del job `build` para
  # que el servicio de base de datos no alargue el gate principal; el resto de
  # los tests (node:test) corre también aquí porque `npm test` ejecuta la suite
  # completa — sin PGTEST_URL la suite RLS se omite (skip), nunca falsea verde.
  rls:
    name: RLS · migración 043 (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Tests (node:test) con PostgreSQL
        run: npm test
        env:
          PGTEST_URL: postgres://postgres:postgres@localhost:5432/postgres

  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational only: the repo has known strict-mode lint findings
      # (react-hooks/set-state-in-effect, etc.) documented as non-blocking
      # false positives. Surfaced here without gating so the hard checks below
      # stay meaningful. Drop continue-on-error once the lint baseline is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Copy compliance (términos prohibidos, Fase 2C)
        run: npm run check:copy

      - name: Neutralidad política y sin compradores nombrados (María / RAG)
        run: npm run check:neutralidad

      - name: Tests (node:test)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The app instantiates Supabase/Anthropic lazily, so the build must
          # succeed without real secrets (this is enforced by convention — see
          # CLAUDE.md §Framework). Placeholders cover any NEXT_PUBLIC_* read at
          # build time so page-data collection never sees an empty string.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://mape.legal
